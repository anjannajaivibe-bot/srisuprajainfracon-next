<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">House planning on regular and irregular plots</title><desc id="desc">Illustration showing how homes, parking and gardens can be arranged on different plot shapes.</desc><rect width="1600" height="900" fill="#eef2ff"/><g transform="translate(120 120)"><rect width="580" height="560" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="10"/><rect x="90" y="100" width="400" height="290" rx="12" fill="#dbeafe"/><rect x="95" y="420" width="185" height="90" rx="10" fill="#94a3b8"/><rect x="320" y="420" width="170" height="90" rx="10" fill="#86efac"/><text x="290" y="625" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#0f172a">Straightforward planning</text></g><g transform="translate(900 120)"><polygon points="40,0 570,85 485,560 0,495" fill="#ffffff" stroke="#2563eb" stroke-width="10"/><polygon points="125,105 475,160 420,370 90,330" fill="#dbeafe"/><polygon points="115,365 290,390 270,480 90,455" fill="#94a3b8"/><polygon points="330,405 440,425 410,505 300,485" fill="#86efac"/><text x="285" y="625" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#0f172a">Creative use of angled space</text></g><g font-family="Arial" font-size="30" font-weight="700" fill="#334155"><text x="250" y="270">HOME</text><text x="217" y="595">PARKING</text><text x="445" y="595">GARDEN</text><text x="1115" y="285">HOME</text><text x="1025" y="590">PARKING</text><text x="1295" y="590">GARDEN</text></g></svg>