<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Comparison of narrow and wide residential plot frontage</title><desc id="desc">Two plots of similar area show how different frontage and depth proportions affect planning.</desc><rect width="1600" height="900" fill="#f7fbff"/><rect x="0" y="690" width="1600" height="150" fill="#3e4f5d"/><rect x="0" y="748" width="1600" height="10" fill="#f2c94c"/><g transform="translate(130 130)"><rect width="560" height="500" rx="24" fill="#e7f2df" stroke="#1c5f9f" stroke-width="8"/><rect x="180" y="80" width="200" height="300" rx="12" fill="#fff" stroke="#173c62" stroke-width="8"/><path d="M155 120l125-80 125 80" fill="none" stroke="#1c5f9f" stroke-width="16" stroke-linecap="round"/><rect x="225" y="250" width="70" height="130" fill="#d9ecff" stroke="#173c62" stroke-width="7"/><rect x="314" y="180" width="45" height="55" fill="#bde3ff" stroke="#173c62" stroke-width="6"/><path d="M60 455h440" stroke="#f0a629" stroke-width="12" stroke-dasharray="22 16"/><path d="M60 480v-45M500 480v-45" stroke="#1c5f9f" stroke-width="10"/><text x="280" y="535" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173c62">NARROW FRONTAGE</text></g><g transform="translate(910 130)"><rect width="560" height="500" rx="24" fill="#e7f2df" stroke="#1c5f9f" stroke-width="8"/><rect x="90" y="120" width="380" height="240" rx="12" fill="#fff" stroke="#173c62" stroke-width="8"/><path d="M65 150l215-110 215 110" fill="none" stroke="#1c5f9f" stroke-width="16" stroke-linecap="round"/><rect x="170" y="230" width="75" height="130" fill="#d9ecff" stroke="#173c62" stroke-width="7"/><rect x="285" y="190" width="115" height="70" fill="#bde3ff" stroke="#173c62" stroke-width="6"/><path d="M45 455h470" stroke="#f0a629" stroke-width="12" stroke-dasharray="22 16"/><path d="M45 480v-45M515 480v-45" stroke="#1c5f9f" stroke-width="10"/><text x="280" y="535" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173c62">WIDE FRONTAGE</text></g><text x="800" y="820" text-anchor="middle" font-family="Arial" font-size="44" font-weight="700" fill="#173c62">Same Area, Different Planning Possibilities</text></svg>