<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Regular and irregular plot shape comparison</title><desc id="desc">Side-by-side diagram comparing a rectangular plot with a tapered plot.</desc><rect width="1600" height="900" fill="#f8fafc"/><g transform="translate(150 130)"><rect x="0" y="0" width="520" height="520" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="12"/><rect x="80" y="90" width="360" height="300" rx="12" fill="#bfdbfe"/><rect x="150" y="415" width="220" height="70" rx="10" fill="#93c5fd"/><text x="260" y="-35" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700" fill="#0f172a">REGULAR PLOT</text></g><g transform="translate(900 130)"><polygon points="30,0 520,70 445,520 0,455" fill="#eff6ff" stroke="#1d4ed8" stroke-width="12"/><polygon points="110,100 430,145 375,390 75,360" fill="#bfdbfe"/><polygon points="155,405 355,430 330,490 135,465" fill="#93c5fd"/><text x="260" y="-35" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700" fill="#0f172a">IRREGULAR PLOT</text></g><g font-family="Arial" fill="#334155" font-size="34" text-anchor="middle"><text x="410" y="760">Straight boundaries and balanced dimensions</text><text x="1160" y="760">Angled boundaries and customised planning</text></g></svg>