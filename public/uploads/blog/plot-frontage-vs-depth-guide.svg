<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">Plot frontage versus depth guide</title><desc id="desc">Two plot shapes illustrating how frontage and depth influence future home planning</desc><rect width="1400" height="820" fill="#f7f9fc"/><text x="70" y="82" font-family="Arial" font-size="42" font-weight="800" fill="#0b1633">Frontage vs Depth: Shape Changes What You Can Build</text><text x="70" y="126" font-family="Arial" font-size="24" fill="#596779">Similar plot areas can offer very different planning flexibility.</text><rect x="55" y="635" width="1290" height="120" rx="22" fill="#2c3440"/><text x="700" y="707" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#ffffff">INTERNAL ROAD</text><g font-family="Arial"><g><rect x="110" y="225" width="480" height="410" rx="18" fill="#eaf3fb" stroke="#123a62" stroke-width="5"/><line x1="110" y1="187" x2="590" y2="187" stroke="#b18415" stroke-width="5"/><polygon points="110,187 132,175 132,199" fill="#b18415"/><polygon points="590,187 568,175 568,199" fill="#b18415"/><text x="350" y="165" text-anchor="middle" font-size="24" font-weight="700" fill="#b18415">Wider frontage</text><text x="150" y="292" font-size="30" font-weight="800" fill="#0b1633">More road-facing width</text><text x="150" y="347" font-size="23" fill="#4b596a">• Easier entry and parking planning</text><text x="150" y="390" font-size="23" fill="#4b596a">• More facade and room-layout options</text><text x="150" y="433" font-size="23" fill="#4b596a">• Better flexibility for future construction</text><rect x="150" y="500" width="400" height="82" rx="16" fill="#ffffff"/><text x="350" y="550" text-anchor="middle" font-size="22" font-weight="700" fill="#123a62">Useful when future building is important</text></g><g><rect x="815" y="170" width="360" height="465" rx="18" fill="#eaf3fb" stroke="#123a62" stroke-width="5"/><line x1="1215" y1="170" x2="1215" y2="635" stroke="#b18415" stroke-width="5"/><polygon points="1215,170 1203,192 1227,192" fill="#b18415"/><polygon points="1215,635 1203,613 1227,613" fill="#b18415"/><text x="1245" y="420" transform="rotate(90 1245 420)" text-anchor="middle" font-size="24" font-weight="700" fill="#b18415">Greater depth</text><text x="855" y="245" font-size="30" font-weight="800" fill="#0b1633">Deeper plot</text><text x="855" y="302" font-size="23" fill="#4b596a">• Longer floor-plan possibilities</text><text x="855" y="345" font-size="23" fill="#4b596a">• Scope for rear open space</text><text x="855" y="388" font-size="23" fill="#4b596a">• Can suit specific house designs</text><rect x="855" y="468" width="280" height="100" rx="16" fill="#ffffff"/><text x="995" y="510" text-anchor="middle" font-size="21" font-weight="700" fill="#123a62">Check setbacks and</text><text x="995" y="540" text-anchor="middle" font-size="21" font-weight="700" fill="#123a62">usable building width</text></g></g><text x="700" y="795" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#b18415">Before booking, compare exact dimensions, road-facing width and intended use.</text></svg>