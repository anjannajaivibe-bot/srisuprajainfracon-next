<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">Plot size comparison for Hyderabad buyers</title><desc id="desc">Comparison of 165, 183, 200 and 240 square yard plot options with practical use cases</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef3f8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".14"/></filter></defs><rect width="1400" height="820" fill="url(#bg)"/><text x="70" y="82" font-family="Arial" font-size="42" font-weight="800" fill="#0b1633">Compare the Plot by Purpose, Not Only by Area</text><text x="70" y="126" font-family="Arial" font-size="24" fill="#586678">Illustrative planning guide for common residential plot sizes</text><g font-family="Arial" filter="url(#s)"><g transform="translate(70 205)"><rect width="280" height="470" rx="28" fill="#ffffff" stroke="#dbe4ed"/><rect x="24" y="24" width="232" height="120" rx="18" fill="#eaf3fb" stroke="#123a62" stroke-width="4"/><text x="140" y="78" text-anchor="middle" font-size="34" font-weight="800" fill="#0b1633">165</text><text x="140" y="113" text-anchor="middle" font-size="22" font-weight="700" fill="#123a62">sq. yd.</text><text x="28" y="198" font-size="23" font-weight="700" fill="#0b1633">Works well for</text><text x="28" y="244" font-size="21" fill="#4b596a">• Budget-conscious buyers</text><text x="28" y="282" font-size="21" fill="#4b596a">• Compact future homes</text><text x="28" y="320" font-size="21" fill="#4b596a">• Long-term land holding</text><text x="28" y="386" font-size="20" font-weight="700" fill="#b18415">Check frontage carefully</text></g><g transform="translate(385 180)"><rect width="280" height="495" rx="28" fill="#ffffff" stroke="#dbe4ed"/><rect x="24" y="24" width="232" height="145" rx="18" fill="#eaf3fb" stroke="#123a62" stroke-width="4"/><text x="140" y="88" text-anchor="middle" font-size="36" font-weight="800" fill="#0b1633">183</text><text x="140" y="126" text-anchor="middle" font-size="22" font-weight="700" fill="#123a62">sq. yd.</text><text x="28" y="222" font-size="23" font-weight="700" fill="#0b1633">Balanced option</text><text x="28" y="268" font-size="21" fill="#4b596a">• More design flexibility</text><text x="28" y="306" font-size="21" fill="#4b596a">• Better open-space scope</text><text x="28" y="344" font-size="21" fill="#4b596a">• Investment + future use</text><text x="28" y="410" font-size="20" font-weight="700" fill="#b18415">A practical middle ground</text></g><g transform="translate(700 155)"><rect width="280" height="520" rx="28" fill="#ffffff" stroke="#dbe4ed"/><rect x="24" y="24" width="232" height="170" rx="18" fill="#eaf3fb" stroke="#123a62" stroke-width="4"/><text x="140" y="96" text-anchor="middle" font-size="38" font-weight="800" fill="#0b1633">200</text><text x="140" y="136" text-anchor="middle" font-size="22" font-weight="700" fill="#123a62">sq. yd.</text><text x="28" y="247" font-size="23" font-weight="700" fill="#0b1633">More versatile</text><text x="28" y="293" font-size="21" fill="#4b596a">• Broader planning choices</text><text x="28" y="331" font-size="21" fill="#4b596a">• Family-home potential</text><text x="28" y="369" font-size="21" fill="#4b596a">• Stronger frontage scope</text><text x="28" y="435" font-size="20" font-weight="700" fill="#b18415">Useful for future building</text></g><g transform="translate(1015 125)"><rect width="315" height="550" rx="28" fill="#ffffff" stroke="#dbe4ed"/><rect x="24" y="24" width="267" height="200" rx="18" fill="#eaf3fb" stroke="#123a62" stroke-width="4"/><text x="157" y="106" text-anchor="middle" font-size="40" font-weight="800" fill="#0b1633">240+</text><text x="157" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#123a62">sq. yd.</text><text x="28" y="277" font-size="23" font-weight="700" fill="#0b1633">Larger-format use</text><text x="28" y="323" font-size="21" fill="#4b596a">• Premium future homes</text><text x="28" y="361" font-size="21" fill="#4b596a">• More landscaping space</text><text x="28" y="399" font-size="21" fill="#4b596a">• Weekend-home planning</text><text x="28" y="465" font-size="20" font-weight="700" fill="#b18415">Higher budget commitment</text></g></g><rect x="70" y="720" width="1260" height="62" rx="18" fill="#0b1633"/><text x="700" y="759" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">Plot dimensions, frontage, road position and intended use can matter as much as total square yards.</text></svg>