<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" fill="#f7f9fc"/><text x="70" y="82" font-family="Arial" font-size="42" font-weight="800" fill="#0b1633">Plot Loan Documents Checklist</text><text x="70" y="126" font-family="Arial" font-size="24" fill="#596779">Keep applicant and property papers ready before approaching the lender.</text><g font-family="Arial"><g transform="translate(70 190)"><rect width="600" height="520" rx="28" fill="#fff" stroke="#dbe4ed"/><text x="36" y="64" font-size="30" font-weight="800" fill="#0b1633">Applicant documents</text><text x="40" y="124" font-size="24" fill="#4b596a">✓ PAN and identity proof</text><text x="40" y="174" font-size="24" fill="#4b596a">✓ Address proof</text><text x="40" y="224" font-size="24" fill="#4b596a">✓ Salary slips or income proof</text><text x="40" y="274" font-size="24" fill="#4b596a">✓ Bank statements</text><text x="40" y="324" font-size="24" fill="#4b596a">✓ Form 16 / ITR as applicable</text><text x="40" y="374" font-size="24" fill="#4b596a">✓ Existing loan details</text><text x="40" y="424" font-size="24" fill="#4b596a">✓ Proof of own contribution</text></g><g transform="translate(730 190)"><rect width="600" height="520" rx="28" fill="#fff" stroke="#dbe4ed"/><text x="36" y="64" font-size="30" font-weight="800" fill="#0b1633">Property documents</text><text x="40" y="124" font-size="24" fill="#4b596a">✓ Allotment / sale agreement</text><text x="40" y="174" font-size="24" fill="#4b596a">✓ Approved layout details</text><text x="40" y="224" font-size="24" fill="#4b596a">✓ Title and ownership papers</text><text x="40" y="274" font-size="24" fill="#4b596a">✓ Payment receipts</text><text x="40" y="324" font-size="24" fill="#4b596a">✓ Survey / plot details</text><text x="40" y="374" font-size="24" fill="#4b596a">✓ RERA details where applicable</text><text x="40" y="424" font-size="24" fill="#4b596a">✓ Any lender-specific legal papers</text></g></g><rect x="70" y="748" width="1260" height="52" rx="15" fill="#0b1633"/><text x="700" y="782" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#fff">Exact requirements vary by lender, applicant type and property.</text></svg>