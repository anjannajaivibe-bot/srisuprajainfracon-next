<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" fill="#f8fafc"/><text x="70" y="82" font-family="Arial" font-size="42" font-weight="800" fill="#0b1633">How a Plot Loan Application Usually Moves</text><text x="70" y="126" font-family="Arial" font-size="24" fill="#596779">A simple buyer-side view of the process.</text><g font-family="Arial" text-anchor="middle"><g transform="translate(85 240)"><circle cx="90" cy="90" r="82" fill="#eaf3fb" stroke="#123a62" stroke-width="5"/><text x="90" y="82" font-size="34" font-weight="800" fill="#0b1633">1</text><text x="90" y="120" font-size="20" font-weight="700" fill="#123a62">Eligibility</text><text x="90" y="210" font-size="22" font-weight="700" fill="#0b1633">Income and credit</text><text x="90" y="242" font-size="22" font-weight="700" fill="#0b1633">assessment</text></g><path d="M280 330 H410" stroke="#b18415" stroke-width="6" marker-end="url(#a)"/><g transform="translate(425 240)"><circle cx="90" cy="90" r="82" fill="#eaf3fb" stroke="#123a62" stroke-width="5"/><text x="90" y="82" font-size="34" font-weight="800" fill="#0b1633">2</text><text x="90" y="120" font-size="20" font-weight="700" fill="#123a62">Documents</text><text x="90" y="210" font-size="22" font-weight="700" fill="#0b1633">KYC, income and</text><text x="90" y="242" font-size="22" font-weight="700" fill="#0b1633">property papers</text></g><path d="M620 330 H750" stroke="#b18415" stroke-width="6"/><g transform="translate(765 240)"><circle cx="90" cy="90" r="82" fill="#eaf3fb" stroke="#123a62" stroke-width="5"/><text x="90" y="82" font-size="34" font-weight="800" fill="#0b1633">3</text><text x="90" y="120" font-size="20" font-weight="700" fill="#123a62">Due diligence</text><text x="90" y="210" font-size="22" font-weight="700" fill="#0b1633">Legal and technical</text><text x="90" y="242" font-size="22" font-weight="700" fill="#0b1633">property checks</text></g><path d="M960 330 H1090" stroke="#b18415" stroke-width="6"/><g transform="translate(1105 240)"><circle cx="90" cy="90" r="82" fill="#eaf3fb" stroke="#123a62" stroke-width="5"/><text x="90" y="82" font-size="34" font-weight="800" fill="#0b1633">4</text><text x="90" y="120" font-size="20" font-weight="700" fill="#123a62">Sanction</text><text x="90" y="210" font-size="22" font-weight="700" fill="#0b1633">Terms, contribution</text><text x="90" y="242" font-size="22" font-weight="700" fill="#0b1633">and disbursement</text></g></g><rect x="120" y="585" width="1160" height="120" rx="22" fill="#0b1633"/><text x="700" y="635" text-anchor="middle" font-family="Arial" font-size="25" font-weight="800" fill="#d2aa34">Important</text><text x="700" y="677" text-anchor="middle" font-family="Arial" font-size="23" fill="#fff">A loan sanction does not replace the buyer's own legal verification of the plot and project.</text></svg>