name: Audit and optimize blog images

on:
  push:
    branches: [master]
    paths:
      - 'scripts/blog-image-audit-2026-08.trigger'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dimensions and optimize inline images
        run: node scripts/audit-optimize-inline-blog-images.mjs

      - name: Commit optimized blog assets
        shell: bash
        run: |
          rm -f scripts/blog-image-audit-2026-08.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog public/uploads/blog scripts/blog-image-audit-2026-08.trigger
          if git diff --cached --quiet; then
            echo "No blog image changes required."
            exit 0
          fi
          git commit -m "Optimize inline blog images and add intrinsic dimensions"
          git push
