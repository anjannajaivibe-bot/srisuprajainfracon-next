name: Apply entity authority fix
on:
  push:
    branches:
      - agent/entity-authority-links-2026-08-15
    paths:
      - 'scripts/entity-authority.trigger'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add official Supraja IRIS domain link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/project/ProjectOverview.tsx')
          s=p.read_text()
          old='''              ))}\n              <a\n                href="https://www.google.com/maps"'''
          new='''              ))}\n              {project.slug === "supraja-iris-resort-plots" && (\n                <a\n                  href="https://suprajairis.com/"\n                  target="_blank"\n                  rel="noopener noreferrer"\n                  className="text-blue-700 underline"\n                >\n                  Visit Supraja IRIS official website\n                </a>\n              )}\n              <a\n                href="https://www.google.com/maps"'''
          if old not in s:
              raise SystemExit('Expected project links block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit production fix and clean tooling
        run: |
          rm -f scripts/entity-authority.trigger .github/workflows/entity-authority-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/project/ProjectOverview.tsx scripts/entity-authority.trigger .github/workflows/entity-authority-fix.yml
          git commit -m "seo: link Supraja IRIS to official project domain"
          git push origin HEAD:agent/entity-authority-links-2026-08-15
