name: Apply keyword emphasis

on:
  push:
    paths:
      - scripts/apply-keyword-emphasis.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/selective-semantic-emphasis
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply scoped copy changes
        run: node scripts/apply-keyword-emphasis.mjs
      - name: Remove one-time tooling
        run: |
          rm scripts/apply-keyword-emphasis.mjs
          rm .github/workflows/apply-keyword-emphasis.yml
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "seo: integrate keyword opportunities naturally across core pages"
          git push origin HEAD:seo/selective-semantic-emphasis
